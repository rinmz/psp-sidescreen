[package]
name = "sidescreen-setup"
description = "What the PSP Sidescreen installer does: the drivers, and the program on the PSP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sidescreen-setup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
