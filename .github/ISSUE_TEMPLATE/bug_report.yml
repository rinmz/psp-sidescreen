name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. The more exact you are, the faster this can be fixed.
        For a security problem, do not use this form; see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PSP Sidescreen version
      description: Shown at the bottom right of the window, and on the About page.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2, 64-bit"
    validations:
      required: true
  - type: input
    id: psp
    attributes:
      label: PSP model and firmware
      placeholder: "PSP-2000, 6.61 PRO-C"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - Wi-Fi
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output of the command line, if you ran it
      description: "`sidescreen-host run --virtual` shows what the session is doing."
      render: text
