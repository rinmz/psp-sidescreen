name: Feature request
description: An idea for something PSP Sidescreen could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation first; the solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought of
